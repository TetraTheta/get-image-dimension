[package]
edition = "2024"
name = "get-image-dimension"
version = "1.1.1"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
image = "0.25.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
